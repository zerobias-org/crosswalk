name: Publish Crosswalk

on:
  push:
    branches: [main, qa, dev, uat]
    paths:
      - 'package/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      crosswalk:
        description: 'Crosswalk to publish (e.g. aiuc/aiuc_1/v1_csa_aicm_v1). Leave blank for all changed.'
        required: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    uses: zerobias-org/devops/.github/workflows/zbb-publish-reusable.yml@main
    with:
      ghcr-namespace: zerobias-org
      dispatch-input-name: crosswalk
      dispatch-input-value: ${{ inputs.crosswalk }}
    secrets: inherit
